name: 🐛 Bug Report
description: Create a report to help us improve Cadran
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues before submitting.
  - type: input
    id: version
    attributes:
      label: Application Version
      description: What version or git commit are you running? (e.g. v1.1.0)
      placeholder: v1.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Windows 11 x64
        - Windows 10 x64
        - Linux x64 (Ubuntu / Debian)
        - Linux x64 (Arch / Fedora / Other)
        - macOS
        - Other (specify below)
    validations:
      required: true
  - type: dropdown
    id: execution_mode
    attributes:
      label: Deployment / Execution Mode
      description: How are you running the application?
      options:
        - Standalone single-file binary
        - Archive deployment (zip / tar.gz)
        - System service (systemd / Windows service)
        - Windows System Tray Supervisor
        - Built from source (dotnet run)
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Start application with '...'
        2. Perform action '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs & Diagnostic Output
      description: Please copy/paste relevant console logs, stack traces, or diagnostic output here.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I am using an official release or the latest commit on main.
          required: true